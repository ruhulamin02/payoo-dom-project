<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Google font -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

    <!-- tailwind -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Daisyui -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="/tailwind.css">
    <!-- font awesome kit -->
    <script src="https://kit.fontawesome.com/a8e3f28a4c.js" crossorigin="anonymous"></script>
</head>

<body class=" bg-black font-[outfit]">
    <section class="bg-[#F4F5F7] max-w-md  mx-auto min-h-screen ">

        <!-- header -->
        <header class=" bg-white  rounded-2xl shadow-sm  mb-6">

            <!-- Navbar -->
            <nav class="   flex justify-between items-center px-6 ">

                <div class="flex justify-center items-center">

                    <img class="w-14" src="/assets/Group.png" alt="">


                    <div class="space-y-1">
                        <h2 class="font-bold">$45000</h2>
                        <p class="text-gray-500">Available Balance</p>
                    </div>
                </div>
                <div>
                    <button class=" btn btn-ghost text-gray-500 border-2 border-gray-300"><i
                            class="fa-solid fa-right-from-bracket rotate rotate-180"></i> Log Out</button>
                </div>
            </nav>

            <hr class="border-t-2  border-gray-300 my-5">

            <!-- Hero Section -->
            <section class="px-6 my-10 rounded-b-2xl">
                <h1 class="font-bold text-2xl">Welcom to Payooo!</h1>
                <p class="text-gray-500">Enjoy easy and convenient financial services with us. Cashout charge is low and
                </p>

                <!-- grid -->
                <div class="mx-auto py-8 grid-cols-2 sm:grid-cols-3 sm:grid-rows-2 gap-4 grid">
                    <!-- grid 1 -->
                    <div class="flex flex-col justify-center items-center border border-gray-200 rounded-2xl px-2 py-5">
                        <img src="/assets/wallet1.png" alt="">
                        <p class="text-gray-500">Add Money</p>
                    </div>

                    <!-- grid 2 -->
                    <div class="flex flex-col justify-center items-center border border-gray-200 rounded-2xl px-2 py-5">
                        <img src="/assets/send1.png" alt="">
                        <p class="text-gray-500">Cashout</p>
                    </div>
                    <!-- grid 3 -->
                    <div class="flex flex-col justify-center items-center border border-gray-200 rounded-2xl px-2 py-5">
                        <img src="/assets/money1.png" alt="">
                        <p class="text-gray-500">Transfer Money</p>
                    </div>
                    <!-- grid 4 -->
                    <div class="flex flex-col justify-center items-center border border-gray-200 rounded-2xl px-2 py-5">
                        <img src="/assets/bonus1.png" alt="">
                        <p class="text-gray-500">Get Bonus</p>
                    </div>
                    <!-- grid 5 -->
                    <div class="flex flex-col justify-center items-center border border-gray-200 rounded-2xl px-2 py-5">

                        <img src="/assets/purse1.png" alt="">
                        <p class="text-gray-500">Pay bill</p>
                    </div>
                    <!-- grid 6 -->
                    <div class="flex flex-col justify-center items-center border border-gray-200 rounded-2xl px-2 py-5">
                        <img src="/assets/transaction1.png" alt="">
                        <p class="text-gray-500">Transaction</p>
                    </div>


                </div>
            </section>

        </header>
    </section>


    <main>

    </main>

</body>

</html>
